<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Wallet body -->
  <rect x="212" y="330" width="600" height="400" rx="48" fill="white"/>

  <!-- Wallet flap -->
  <path d="M212 430 L212 378 Q212 330 260 330 L764 330 Q812 330 812 378 L812 430 Q812 460 764 460 L260 460 Q212 460 212 430 Z" fill="#EFF6FF"/>

  <!-- Fold shadow line -->
  <line x1="232" y1="460" x2="792" y2="460" stroke="#DBEAFE" stroke-width="4" stroke-linecap="round"/>

  <!-- Card slot pocket (right side) -->
  <rect x="640" y="510" width="152" height="100" rx="24" fill="#EFF6FF"/>

  <!-- Clasp / snap button -->
  <circle cx="716" cy="560" r="28" fill="url(#bg)"/>
  <circle cx="716" cy="560" r="14" fill="white" opacity="0.4"/>

  <!-- Card peeking from top -->
  <rect x="500" y="280" width="260" height="80" rx="20" fill="white" opacity="0.35"/>
</svg>
